<text x="48.0" y="74.0" font-size="32" font-weight="700" fill="#f2f3f5" letter-spacing="-0.4">TriBot Music: where it runs</text>
<text x="48.0" y="106.0" font-size="16" font-weight="400" fill="#a3aab6">Two doors, one engine: the public demo and the owner's panel reach the same DJ on one always-on Mac.</text>
