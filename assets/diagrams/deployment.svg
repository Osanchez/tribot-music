<text x="950.0" y="335.0" font-size="16" font-weight="700" fill="#ffb27a">Genre LoRA</text>
<text x="950.0" y="358.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">adapters, one loaded</text>
<text x="950.0" y="377.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">for each take</text>
<rect x="900" y="412" width="234" height="128" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="918.0" y="442.0" font-size="16" font-weight="650" fill="#f2f3f5">Adapter training</text>
<text x="918.0" y="465.5" font-size="13.5" font-weight="400" fill="#a3aab6">For genres the public</text>
<text x="918.0" y="486.0" font-size="13.5" font-weight="400" fill="#a3aab6">set lacks, adapters</text>
<text x="918.0" y="506.5" font-size="13.5" font-weight="400" fill="#a3aab6">are trained here</text>
<text x="902.0" y="580.0" font-size="13.5" font-weight="400" fill="#a3aab6">Starts when a transition</text>
<text x="902.0" y="600.0" font-size="13.5" font-weight="400" fill="#a3aab6">asks for a take, and</text>
<text x="902.0" y="620.0" font-size="13.5" font-weight="400" fill="#a3aab6">shuts down when idle.</text>
