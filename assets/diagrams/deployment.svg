<text x="48.0" y="76.0" font-size="32" font-weight="700" fill="#f2f3f5" letter-spacing="-0.4">TriBot Music: where it runs</text>
<text x="48.0" y="108.0" font-size="16" font-weight="400" fill="#a3aab6">One always-on Mac is home to the system; a cloud GPU is called only when a mix needs it.</text>
<rect x="48" y="150" width="270" height="400" rx="18" fill="#14171e" stroke="#3a404c" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="68.0" y="180.0" font-size="12.5" font-weight="700" fill="#3a404c" letter-spacing="1.8">PUBLIC INTERNET</text>
<rect x="48" y="580" width="270" height="210" rx="18" fill="#0f151f" stroke="#4ea1ff" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="68.0" y="610.0" font-size="12.5" font-weight="700" fill="#4ea1ff" letter-spacing="1.8">PRIVATE NETWORK</text>
<rect x="350" y="150" width="500" height="640" rx="18" fill="#151922" stroke="#f2f3f5" stroke-width="1.5"/>
<text x="370.0" y="180.0" font-size="12.5" font-weight="700" fill="#f2f3f5" letter-spacing="1.8">THE MAC</text>
<text x="447.7" y="180.0" font-size="13.5" font-weight="400" fill="#a3aab6">·  Apple Silicon, always on</text>
<rect x="882" y="150" width="270" height="640" rx="18" fill="#1a130e" stroke="#ff7a2c" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="902.0" y="180.0" font-size="12.5" font-weight="700" fill="#ff7a2c" letter-spacing="1.8">CLOUD GPU</text>
<text x="999.1" y="180.0" font-size="13.5" font-weight="400" fill="#a3aab6">·  Modal</text>
<rect x="68" y="200" width="230" height="104" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="86.0" y="230.0" font-size="17" font-weight="650" fill="#f2f3f5">Visitor</text>
<text x="86.0" y="253.5" font-size="13.5" font-weight="400" fill="#a3aab6">Any browser, on the</text>
<text x="86.0" y="274.0" font-size="13.5" font-weight="400" fill="#a3aab6">public demo</text>
<rect x="68" y="340" width="230" height="128" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="86.0" y="370.0" font-size="17" font-weight="650" fill="#f2f3f5">Cloudflare</text>
<text x="86.0" y="393.5" font-size="13.5" font-weight="400" fill="#a3aab6">Tunnel in, and a</text>
<text x="86.0" y="414.0" font-size="13.5" font-weight="400" fill="#a3aab6">human check before</text>
<text x="86.0" y="434.5" font-size="13.5" font-weight="400" fill="#a3aab6">a demo sign-in</text>
<rect x="68" y="626" width="230" height="128" rx="12" fill="#1b1f28" stroke="#4ea1ff" stroke-width="1.5"/>
<text x="86.0" y="656.0" font-size="17" font-weight="650" fill="#f2f3f5">Owner</text>
<text x="86.0" y="679.5" font-size="13.5" font-weight="400" fill="#a3aab6">The full panel, with</text>
<text x="86.0" y="700.0" font-size="13.5" font-weight="400" fill="#a3aab6">sign-in; never on the</text>
<text x="86.0" y="720.5" font-size="13.5" font-weight="400" fill="#a3aab6">public internet</text>
<rect x="370" y="196" width="460" height="412" rx="14" fill="none" stroke="#3a404c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="388.0" y="222.0" font-size="11.5" font-weight="700" fill="#a3aab6" letter-spacing="1.6">CONTAINERS</text>
<rect x="388" y="238" width="200" height="104" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="406.0" y="268.0" font-size="16" font-weight="650" fill="#f2f3f5">Tunnel connector</text>
<text x="406.0" y="291.5" font-size="13.5" font-weight="400" fill="#a3aab6">Dials out: no port</text>
<text x="406.0" y="312.0" font-size="13.5" font-weight="400" fill="#a3aab6">is opened</text>
<rect x="612" y="238" width="200" height="104" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="630.0" y="268.0" font-size="16" font-weight="650" fill="#f2f3f5">Demo gateway</text>
<text x="630.0" y="291.5" font-size="13.5" font-weight="400" fill="#a3aab6">Allow-list of routes;</text>
<text x="630.0" y="312.0" font-size="13.5" font-weight="400" fill="#a3aab6">no secrets, read-only</text>
<rect x="388" y="366" width="200" height="104" rx="12" fill="#1b1f28" stroke="#4ea1ff" stroke-width="1.5"/>
<text x="406.0" y="396.0" font-size="16" font-weight="650" fill="#f2f3f5">Web panel</text>
<text x="406.0" y="419.5" font-size="13.5" font-weight="400" fill="#a3aab6">Player and the</text>
<text x="406.0" y="440.0" font-size="13.5" font-weight="400" fill="#a3aab6">full panel</text>
<rect x="612" y="366" width="200" height="222" rx="12" fill="#1b1f28" stroke="#3a404c" stroke-width="1.5"/>
<text x="630.0" y="396.0" font-size="16" font-weight="650" fill="#f2f3f5">Music bot</text>
<text x="630.0" y="419.5" font-size="13.5" font-weight="400" fill="#a3aab6">DJ engine, one</text>
<text x="630.0" y="440.0" font-size="13.5" font-weight="400" fill="#a3aab6">worker per live set;</text>
<text x="630.0" y="460.5" font-size="13.5" font-weight="400" fill="#a3aab6">the song library</text>
<rect x="626" y="486" width="172" height="88" rx="10" fill="none" stroke="#ff7a2c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="640.0" y="510.0" font-size="11.5" font-weight="700" fill="#ffb27a" letter-spacing="1.6">DEMO SONGS</text>
<text x="640.0" y="533.0" font-size="13.5" font-weight="400" fill="#a3aab6">licence-cleared,</text>
<text x="640.0" y="553.0" font-size="13.5" font-weight="400" fill="#a3aab6">kept apart</text>
<text x="390.0" y="508.0" font-size="13.5" font-weight="400" fill="#a3aab6">Visitors share one demo</text>
<text x="390.0" y="528.0" font-size="13.5" font-weight="400" fill="#a3aab6">account and cannot</text>
<text x="390.0" y="548.0" font-size="13.5" font-weight="400" fill="#a3aab6">change its settings.</text>
<rect x="370" y="628" width="460" height="142" rx="14" fill="none" stroke="#4ea1ff" stroke-width="1.5"/>
<text x="388.0" y="654.0" font-size="11.5" font-weight="700" fill="#4ea1ff" letter-spacing="1.6">NATIVE, ON THE MAC'S GPU</text>
<rect x="388" y="668" width="424" height="86" rx="12" fill="#1b1f28" stroke="#4ea1ff" stroke-width="1.5"/>
<text x="406.0" y="698.0" font-size="16" font-weight="650" fill="#f2f3f5">Stems service</text>
<text x="406.0" y="721.5" font-size="13.5" font-weight="400" fill="#a3aab6">Demucs, RoFormer, MMS, Whisper</text>
<rect x="900" y="200" width="234" height="86" rx="22" fill="#2a1a10" stroke="#ff7a2c" stroke-width="2"/>
<rect x="917" y="234.0" width="18" height="18" rx="4" fill="none" stroke="#ff7a2c" stroke-width="2"/>
