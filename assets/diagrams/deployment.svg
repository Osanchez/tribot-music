<text x="950.0" y="229.0" font-size="16" font-weight="700" fill="#ffb27a">ACE-Step turbo</text>
<text x="950.0" y="252.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">reworks the join</text>
<text x="950.0" y="271.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">of a blend</text>
<rect x="900" y="306" width="234" height="86" rx="22" fill="#2a1a10" stroke="#ff7a2c" stroke-width="2"/>
<rect x="917" y="340.0" width="18" height="18" rx="4" fill="none" stroke="#ff7a2c" stroke-width="2"/>
