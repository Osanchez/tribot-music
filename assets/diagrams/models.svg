<text x="86.0" y="694.0" font-size="11.5" font-weight="700" fill="#ffb27a" letter-spacing="1.6">THE ADAPTERS</text>
<text x="86.0" y="718.0" font-size="13.5" font-weight="400" fill="#f2f3f5" opacity="0.86">The one for the genre the join leads into is used;</text>
<text x="86.0" y="737.0" font-size="13.5" font-weight="400" fill="#f2f3f5" opacity="0.86">else the song it leaves. Most are a public set;</text>
<text x="86.0" y="756.0" font-size="13.5" font-weight="400" fill="#f2f3f5" opacity="0.86">the project trained its own on Modal for a genre</text>
<text x="86.0" y="775.0" font-size="13.5" font-weight="400" fill="#f2f3f5" opacity="0.86">that set lacked.</text>
<text x="86.0" y="779.0" font-size="13.5" font-weight="400" fill="#f2f3f5"></text>
