<text x="48.0" y="76.0" font-size="32" font-weight="700" fill="#f2f3f5" letter-spacing="-0.4">TriBot Music: the models</text>
<text x="48.0" y="108.0" font-size="16" font-weight="400" fill="#a3aab6">Each song is taken apart and learned once; each join is built from those parts and reworked by AI.</text>
