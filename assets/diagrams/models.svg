<text x="68.0" y="450.0" font-size="12.5" font-weight="700" fill="#ff7a2c" letter-spacing="1.8">2 · A TRANSITION IS MADE</text>
<text x="293.8" y="450.0" font-size="13.5" font-weight="400" fill="#a3aab6">·  ahead of time, while the current song plays</text>
<rect x="68" y="530" width="196" height="116" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="86.0" y="560.0" font-size="16" font-weight="650" fill="#f2f3f5">DJ engine</text>
<text x="86.0" y="582.5" font-size="12.5" font-weight="400" fill="#a3aab6">Stem blend: parts of</text>
<text x="86.0" y="602.0" font-size="12.5" font-weight="400" fill="#a3aab6">both songs laid on</text>
<text x="86.0" y="621.5" font-size="12.5" font-weight="400" fill="#a3aab6">their tracked beats</text>
<rect x="300" y="530" width="196" height="116" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="318.0" y="560.0" font-size="16" font-weight="650" fill="#f2f3f5">Mix check</text>
<text x="318.0" y="582.5" font-size="12.5" font-weight="400" fill="#a3aab6">Measures the render,</text>
<text x="318.0" y="602.0" font-size="12.5" font-weight="400" fill="#a3aab6">fixes it or refuses</text>
<text x="318.0" y="621.5" font-size="12.5" font-weight="400" fill="#a3aab6">it before it plays</text>
