<text x="640.0" y="725.0" font-size="15.5" font-weight="700" fill="#ffb27a">Genre LoRA adapter</text>
<text x="640.0" y="744.5" font-size="12.5" font-weight="400" fill="#f2f3f5" opacity="0.84">steers ACE-Step toward a genre</text>
