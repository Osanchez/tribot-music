<text x="746.0" y="308.5" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">writes the lyrics when none are found</text>
<rect x="1032" y="228" width="102" height="96" rx="12" fill="#1b1f28" stroke="#3a404c" stroke-width="1.5"/>
<text x="1050.0" y="258.0" font-size="16" font-weight="650" fill="#f2f3f5">Library</text>
<text x="1050.0" y="280.5" font-size="12.5" font-weight="400" fill="#a3aab6">kept for</text>
<text x="1050.0" y="300.0" font-size="12.5" font-weight="400" fill="#a3aab6">every mix</text>
<text x="70.0" y="352.0" font-size="13.5" font-weight="400" fill="#a3aab6">MMS lines the lyrics up against the vocal RoFormer pulled out, so the DJ knows where every sung line starts and ends.</text>
