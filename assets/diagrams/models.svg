<text x="264.7" y="180.0" font-size="13.5" font-weight="400" fill="#a3aab6">·  once, in the background, on the Mac's GPU</text>
<rect x="68" y="228" width="150" height="96" rx="12" fill="#1b1f28" stroke="#3a404c" stroke-width="1.5"/>
