<text x="590.0" y="564.5" font-size="16" font-weight="700" fill="#ffb27a">ACE-Step turbo</text>
<text x="590.0" y="587.5" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">on Modal: repaints the middle of</text>
<text x="590.0" y="606.5" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">the join, keeps the DJ's own</text>
<text x="590.0" y="625.5" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">blend at its edges</text>
<rect x="902" y="530" width="232" height="116" rx="12" fill="#1b1f28" stroke="#ff7a2c" stroke-width="1.5"/>
<text x="920.0" y="560.0" font-size="16" font-weight="650" fill="#f2f3f5">Played</text>
<text x="920.0" y="582.5" font-size="12.5" font-weight="400" fill="#a3aab6">The reworked join if it</text>
<text x="920.0" y="602.0" font-size="12.5" font-weight="400" fill="#a3aab6">is back in time and</text>
<text x="920.0" y="621.5" font-size="12.5" font-weight="400" fill="#a3aab6">passes its checks</text>
