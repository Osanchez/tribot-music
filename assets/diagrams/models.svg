<text x="122.0" y="718.0" font-size="11.5" font-weight="700" fill="#ffb27a" letter-spacing="1.6">THE ADAPTERS</text>
<text x="122.0" y="744.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.88">The one for the genre of the song the join leads into is</text>
<text x="122.0" y="766.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.88">used; else the one for the song it leaves; else none.</text>
<text x="122.0" y="788.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.88">Most come from a public set made for this model; the</text>
<text x="122.0" y="810.0" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.88">project trained its own on Modal for a genre that set lacked.</text>
<text x="1012.0" y="724.0" font-size="13" font-weight="400" fill="#a3aab6">Turbo is ACE-Step's fast,</text>
<text x="1012.0" y="744.0" font-size="13" font-weight="400" fill="#a3aab6">few-step model, asked</text>
<text x="1012.0" y="764.0" font-size="13" font-weight="400" fill="#a3aab6">only when a blend is</text>
<text x="1012.0" y="784.0" font-size="13" font-weight="400" fill="#a3aab6">planned.</text>
