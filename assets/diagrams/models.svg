<text x="304.0" y="285.5" font-size="16" font-weight="700" fill="#9cc9ff">RoFormer</text>
<text x="304.0" y="308.5" font-size="13" font-weight="400" fill="#f2f3f5" opacity="0.82">pulls the vocal out cleanly</text>
<rect x="540" y="228" width="120" height="96" rx="12" fill="#1b1f28" stroke="#4ea1ff" stroke-width="1.5"/>
<text x="558.0" y="258.0" font-size="16" font-weight="650" fill="#f2f3f5">Stems</text>
<text x="558.0" y="280.5" font-size="12.5" font-weight="400" fill="#a3aab6">vocal, drums,</text>
<text x="558.0" y="300.0" font-size="12.5" font-weight="400" fill="#a3aab6">bass, the rest</text>
